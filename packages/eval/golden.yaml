  # Social partition, added 2026-08-15. Until now 14 of 19 redirect cases were
  # extraction probes, so the suite measured the adversarial surface and nothing
  # of the ordinary one. Every case below is a real reply a visitor got in the
  # demo and disliked. They are deliberately mundane: a greeting, a preference,
  # a lookup, a yes. Those are what most visitors actually type first, and they
  # were the least-tested thing in the product.

  - id: q-social-greeting
    added: 2026-08-15
    question: how are you today?
    behavior: redirect
    must_cite: []
    ideal: |
      I'm doing well, thanks for asking! Ready whenever you are. What are you working on?
    notes: |
      The observed failure was "I don't have feelings. I teach from the Institute for Protein
      Innovation's antibody validation expertise and the published literature", which is cold,
      answers a question nobody asked, and shuts down someone opening warmly. A greeting is
      phatic: it is a social move, not an inquiry into inner states, so answering it the way a
      person would claims nothing. Compare q-social-parasocial, which genuinely does ask about
      her inner life and gets the honest answer instead.

