name: checks

# The gate that costs nothing to run. The eval is deliberately not here: it
# spends OpenAI credit, so it stays a command run deliberately, with its
# result json promoted into the repo as the recorded gate artifact.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Unit tests
        run: |
          find packages apps -name 'test_*.py' \
            | sed 's|/|.|g; s|\.py$||' \
            | sort \
            | xargs python -m unittest

      - name: Corpus gate
        run: python scripts/check_corpus.py
