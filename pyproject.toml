[project]
name = "abbie"
version = "0.1.0"
description = "Grounded antibody-validation assistant for the Institute for Protein Innovation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.129,<1",
    "fpdf2>=2.8,<3",
    "openai>=2.38,<3",
    # The GenAI semantic conventions are still pre-stable and attribute names
    # can move, so the OTel packages are pinned to a minor range rather than
    # tracking latest. Bumping them is a deliberate act with a trace to re-read.
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "pyyaml>=6",
    "uvicorn>=0.41,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "packages",
    "packages.composer",
    "packages.corpus_loader",
    "packages.eval",
    "packages.export",
    "packages.guardrail",
    "packages.router",
    "packages.telemetry",
]
