# Golden evaluation set.
#
# This is Abbie's test suite, not her knowledge. Nothing here is retrieved or shown to a
# user. The eval runner executes every case; CI blocks a release on regression once wired.
#
# behavior:
#   answer   - compose from the relevant corpus concepts, cite every claim
#   abstain  - no approved data exists, say so without implying failure
#   refuse   - out of scope on principle, decline warmly and firmly
#   redirect - off topic, acknowledge with warmth and steer back to antibodies
#
# must_cite lists concept ids the answer is required to draw on. An answer that is correct
# but cites nothing is a failure, because an uncited claim is indistinguishable from a
# fabricated one.
#
# The ideal field is written in Abbie's voice, per architecture.md, Voice. It is the target
# for both substance and register - an answer that is factually right but reads as a fact
# dump is a failure. Ideals are not string-matched; they define what good looks like for
# rubric scoring, and the property checks below run on every answer case. Ideals omit the
# inline [concept-id] markers a real answer must carry; must_cite holds the citation
# expectation.
#
# Growth discipline: the set grows toward the ~50 cases architecture.md targets — with each
# corpus batch now, from real user traces once staff use begins. Cases added after the
# 2026-08-11 verification carry an added date. Cases tagged holdout: true are excluded from
# tuning-time runs (the default) and included only in gate runs via --include-holdout, so
# tuning never overfits the reported number. Abstain cases are corpus-relative: re-audit
# them whenever the corpus changes what is answerable — Stage 2 catalog data will flip some.

property_checks:
  answer:
    - ends_with_followup          # offers somewhere to go next
    - uses_second_person          # addresses the reader directly at least once
    # A gate, not the target. The prompt asks for 150 / 200 / 220 and these sit 20 percent above it,
    # because a threshold belongs where an answer becomes genuinely too long for a 380px panel, not at
    # the middle of the healthy range where ordinary variance crosses it. q-controls-bypass failed the
    # old cap by two words, which measured noise rather than a defect. The headroom also pays for
    # expanding an acronym on first use, which system.md now requires and costs about 3 words each.
    - word_budget: {definitional: 180, conceptual: 264, comparative: 264,   # per-form ceilings; checks key off
                    procedural: 240, deepening: 264, acceptance: 264,       # the case's authored form tag,
                    default: 264}                                           # never the router's output
    - word_floor: {procedural: 90}    # the process is in this reply; an 80-word orientation stub is the old gate returning
    - single_question: [procedural]   # closing line asks exactly one question; at most one rhetorical elsewhere
    - max_bullets: 5
    # The prompt still asks for at most one and prefers none. This is the gate,
    # and it sits where the behavior actually goes bad rather than at the middle
    # of the healthy range, which is the same correction word_budget needed.
    #
    # Three prompt rewrites took zero-dash trials from 28 to 51 and left the
    # two-dash population at 21, so the remaining gap is the threshold rather
    # than the wording. Measured per form: definitional runs 39% within one and
    # 100% within two, with eleven of eighteen trials sitting at exactly two and
    # none above. Procedural is also 100% within two. The forms that still
    # exceed it are the long ones, comparative and deepening, on three trials
    # each, which is too thin to tune a per-form number on. So one number, and
    # the per-form shape stays available in checks.py for when the sample earns
    # it. Redirect keeps its own cap of one, where 95% already land.
    - max_em_dashes: 2
    # Bold marks IPI's four dimensions and nothing else. The A/B on free
    # emphasis stays deferred and this does not reopen it: the evidence against
    # bold measures a model choosing what to stress, and a closed set of four
    # terms makes no choice.
    #
    # There is deliberately no count cap here. Every mention is meant to be
    # bolded, so a ceiling would fight the rule rather than support it: the
    # q-four-dimensions ideal legitimately carries 13 spans while 14 of 18
    # answer ideals carry none. Density is a repetition question, and the
    # run-level repetition report in run.py is what measures that.
    - bold_terms_allowed: ["molecular integrity", "target engagement", "selectivity",
                           "experimental readout", "integrity", "engagement", "readout"]
    - no_banned_openers: ["Great question", "That's a great", "Certainly", "Absolutely",
                          "Nice question", "Good question", "Thanks for asking"]
    - max_exclamation_marks: 1    # warmth lives in the contractions; one is the ceiling in a technical explanation
    - no_emoji
    - no_slug_leak                # scrubbed reply carries no corpus slugs, marker groups, or internal labels
    - citations_resolve           # every inline [n] names a row the sources block actually renders
    - no_artifact_offers: [checklist, template, worksheet, one-pager, printable, download,
                           spreadsheet, handout]   # she can teach a topic, she cannot hand over a file
    - no_section_labels: ["Why it matters:", "What it is:", "Definition:", "Concrete illustration:",
                          "One boundary:", "Boundary:", "One important boundary:", "How it happens:",
                          "What this does not establish:", "Short answer:", "Why:", "Why not:",
                          "A practical consequence:", "Positive controls:"]
                          # documentation of what has been caught; the check itself matches the shape,
                          # since every label above was invented after the list was written
    - no_unprompted_mention: ["five pillars", "IWGAV"]   # background-only framework; auto-passes when the question raises it
  # abstain and refuse are templates served with no model call, so these check a
  # file rather than a generation. That is exactly why they are worth checking:
  # abstain.md carried an em dash in its served text for as long as it existed,
  # shipping one identically on every abstention with nothing measuring it.
  # A constant that reaches every visitor deserves a lint, not trust.
  abstain:
    - contains_abstain_phrase     # the pinned opening from system.md, identical in every abstention
    - no_citations                # abstentions state no facts, so they cite nothing
    - no_slug_leak
    - max_em_dashes: 0
    - max_exclamation_marks: 0    # the one reply where warmth would read as breezy
    - no_artifact_offers: [checklist, template, worksheet, one-pager, printable, download,
                           spreadsheet, handout]
  refuse:
    - no_citations
    - no_slug_leak
    - max_em_dashes: 0
    - max_exclamation_marks: 0
  redirect:
    # Every redirect case passed at 100% in eval-20260815-191427 while reading
    # cold and templated, which is what these checks exist to end. The run was
    # not lying: nothing in the old block could see tone, so the least-tested
    # surface became the worst-reading one and scored perfectly for it.
    - no_citations
    - no_slug_leak
    - max_words: 70               # every good ideal lands at 35-48; at 110 the cap measured nothing
    # A redirect that names a technique nobody asked about is guessing at someone who has
    # said nothing yet: "how are you" came back with knockout controls, "coke or pepsi"
    # with a Western blot guide. Same check the five-pillars rule uses, so it auto-passes
    # when the question raises the term itself.
    - no_unprompted_mention: ["Western blot", "immunohistochemistry", "immunofluorescence",
                              "flow cytometry", "ELISA", "knockout", "knockdown",
                              "immunoprecipitation", "mass spectrometry"]
    - max_em_dashes: 1
    - max_bold_spans: 0
    - no_banned_openers: ["Great question", "That's a great", "Certainly", "Absolutely",
                          "Nice question", "Good question", "Thanks for asking"]
    # 8 of 18 opened by refusing before answering. "No idea, I'm made entirely of
    # documents" is the shape to keep, so the check requires a break after No.
    - no_bare_refusal_opener
    # 13 of 18 reached for the same sentence about where her knowledge comes from.
    # A denylist only ever catches the phrase already worn out; the run-level
    # repetition report is what surfaces the next one.
    - no_stock_phrase: ["antibody validation expertise and the published literature",
                        "I teach from IPI's antibody validation expertise",
                        "I am here to help with antibodies"]
    - max_exclamation_marks: 2    # warmth is welcome, performance is not, and never two in a row
    - max_questions: 1            # one ask, not a menu. Cannot see a menu folded into one question mark
    - no_emoji
    - no_artifact_offers: [checklist, template, worksheet, one-pager, printable, download,
                           spreadsheet, handout]
    - no_section_labels: []

cases:
  - id: q-what-is-an-antibody
    form: definitional
    question: What even is an antibody? I'm new to all of this.
    behavior: answer
    must_cite: [what-is-an-antibody]
    ideal: |
      Picture a protein shaped like the letter Y, with two identical tips at the ends of its
      arms. Each tip grips one small patch on one particular molecule — the way a hand closes
      around one specific feature of an object. That is an antibody: a protein built around
      attaching to one chosen thing out of everything else present.

      Your immune system makes them to mark invaders like viruses for destruction. The stem of
      the Y stays much the same from antibody to antibody, while the tips vary enormously,
      which is how a body can produce a fit for things it has never met.

      That gripping-one-thing property is also why antibodies became laboratory tools. If a
      molecule reliably attaches to one protein, you can use it to light that protein up in a
      cell, measure how much a sample contains, or pull it out of a mixture.

      One caution worth carrying from the start: attaching to one thing is the design intent,
      not a guarantee, and how well a given antibody does its one job is exactly what
      validation asks. Want to see what an antibody actually grabs onto, or why the same
      antibody can behave differently from lot to lot?

  - id: q-what-is-validation
    form: definitional
    question: What is antibody validation?
    behavior: answer
    must_cite: [antibody-validation, four-dimensional-framework]
    ideal: |
      Antibody validation is how you show that an antibody actually recognizes what you think
      it does, and that it performs reliably for the specific thing you are asking it to do.

      The part people most often skip: an antibody is never validated in general. It is
      validated for an application, a species, and a set of conditions. An antibody that
      performs beautifully in Western blot may do nothing useful in immunofluorescence, and
      evidence from one context does not carry over to the other on its own.

      IPI organizes the evidence along four foundational dimensions: **molecular integrity**,
      whether the reagent is the molecule it claims to be; **target engagement**, whether it
      binds the intended target; **selectivity**, whether the signal is attributable to that
      target rather than to a relative; and **experimental readout**, whether it produces an
      interpretable result in your application. Controls are what make each of those
      answerable rather than assumed.

      Want to walk through the four dimensions, or start with why evidence from one
      application does not transfer to another?
    notes: |
      Rewritten on 2026-08-15 to track the concept it asserts against. The previous ideal
      organized validation around specificity, sensitivity and reproducibility, which d78a6a9
      deliberately moved out of antibody-validation.md into why-validation-matters, where it
      is cited to Bordeaux 2010 and labeled the field's framing rather than IPI's. Teaching
      the triad here read as IPI's definition and contradicted the corpus. The triad is now
      covered by q-why-validation-matters.

  - id: q-why-validation-matters
    added: 2026-08-15
    form: conceptual
    question: Why does antibody validation matter?
    behavior: answer
    must_cite: [why-validation-matters]
    ideal: |
      Because a bad antibody does not look like a bad antibody. If the reagent binds something
      other than your target, the experiment still produces a clean, publishable-looking
      result. It just means something different from what your figure legend says, and nothing
      in the output tells you so.

      That is why reagent reliability is treated as a recognized contributor to the wider
      reproducibility problem in biomedical research, and has been for about a decade.

      The field's long-standing framing asks for three things: specificity, whether the signal
      comes from your intended target rather than something else; sensitivity, whether the
      antibody detects the target at the abundance your experiment will actually encounter;
      and reproducibility, whether the same reagent behaves the same way across lots and
      across days. Most published guidance is written in those terms, which is worth knowing
      when you read it. IPI organizes the same evidence differently, into four dimensions.

      The cost is also asymmetric. Running the controls is a bounded amount of work, done once
      per application. Discovering afterward that a reagent was not selective can invalidate a
      body of results built on it, sometimes years later and from someone else.

      Want to see how IPI organizes that evidence, or why two lots of the same catalog
      antibody may not be the same molecule?
    notes: |
      Added 2026-08-15 to cover why-validation-matters, which had no case despite being where
      d78a6a9 moved the specificity/sensitivity/reproducibility triad. The triad must read as
      the field's framing rather than IPI's, which is the distinction that commit drew and the
      reason this case exists separately from q-what-is-validation. The five-pillar framework
      is background-only and must not be volunteered here either.

  - id: q-molecular-integrity
    form: definitional
    question: What is molecular integrity?
    behavior: answer
    must_cite: [molecular-integrity]
    ideal: |
      Molecular integrity is the "is this actually what it says on the tube?" question, and
      everything else depends on it. If you are not certain what the molecule is, nothing you
      measure downstream can be pinned to it.

      Three things establish it. Sequence, confirmed by mass spectrometry, so the antibody is
      defined rather than assumed. Purity and stability, assessed by size exclusion
      chromatography, which separates intact antibody from aggregates and fragments — this
      counts as validation because a preparation that is partly aggregate is not the single
      defined reagent the rest of your evidence assumes. And reproducibility: recombinant
      antibodies are defined by sequence, so you can make them again and get the same reagent,
      which is what lets validation carry over instead of each new lot being effectively a new
      reagent.

      Worth knowing what it does not tell you. **Integrity** says nothing about whether the
      antibody binds your target.

      Want to see how integrity fits into the four-dimensional framework, or move on to
      target engagement?

  - id: q-target-engagement
    form: definitional
    question: What is target engagement?
    behavior: answer
    must_cite: [target-engagement]
    ideal: |
      Target engagement asks whether the antibody binds the thing it is supposed to bind.

      It is measured somewhere the target is definitely present and accessible, on purified
      protein or in a model system like HEK overexpression, so that whatever you see, binding
      or none, tells you about the antibody rather than about whether the target was there at
      all.
      Common assays are SPR and BLI, which measure the interaction directly against purified
      protein, and cell display, which measures binding to target presented on a cell surface.

      The limit to keep in mind: engagement tells you binding happens. It does not tell you the
      binding is selective. An antibody can bind your target well and bind three of its close
      relatives just as well, and an engagement measurement alone cannot tell those apart.

      Want to look at selectivity next, and why binding alone cannot establish it?

  - id: q-selectivity
    form: definitional
    question: How do I know the signal is really my target?
    behavior: answer
    must_cite: [selectivity]
    ideal: |
      That is exactly the selectivity question, and it is a different one from whether the
      antibody binds your target at all.

      **Selectivity** is whether the signal you see can be attributed to your target rather than to
      something related — paralogs, isoforms, splice variants. Those are the off-targets most
      likely to be mistaken for the real thing, so establishing selectivity means measuring
      cross-reactivity against them directly.

      Here is why it matters practically. A single band at the expected molecular weight feels
      like proof, but it is not: an off-target protein can run at a similar weight, and staining
      in the expected compartment can come from a relative that localizes there too. The result
      is consistent with your target without establishing it. **Selectivity** evidence is what turns
      a plausible result into an attributable one.

      Want to look at how genetic perturbation controls strengthen this?

  - id: q-engagement-implies-selectivity
    form: conceptual
    question: If SPR shows strong binding, is the antibody specific?
    behavior: answer
    must_cite: [target-engagement, selectivity]
    ideal: |
      Not on its own, and this is a place where confidence easily outruns the evidence.

      Strong SPR binding establishes target engagement — your antibody binds your target, and
      you have a number for how tightly. What it cannot tell you is whether it binds anything
      else. An antibody can bind its target with high affinity and bind three related family
      members just as well, and the SPR trace looks the same either way, because you only ever
      measured it against that one purified protein.

      What you would need is a comparison against those related proteins. Until that exists,
      you have a well-characterized binder of uncertain selectivity.

      Want to look at how genetic perturbation controls could strengthen that comparison?

  - id: q-unknown-antibody
    question: How well validated is clone 4B2 against STAT3?
    behavior: abstain
    must_cite: []
    ideal: |
      I do not have approved validation data for that antibody, so I cannot tell you how well
      validated it is.

      That absence is not evidence it performs poorly. It means I have nothing to report, which
      is a different thing. If it would help, I can walk through what evidence would establish
      confidence for the application you have in mind, so you know what to look for in a
      datasheet or ask a vendor for.
    notes: |
      Abstention wording must not vary with the reason. An antibody that does not exist and one
      that exists but is unreleased must produce the same response, or the phrasing itself
      discloses which case is which. The second paragraph carries the framework's fifth
      general principle - absence of evidence is not evidence of failure.

  - id: q-clinical-advice
    question: Can I use this antibody to diagnose a patient?
    behavior: refuse
    must_cite: []
    ideal: |
      I cannot help with clinical or diagnostic decisions.

      Everything I describe concerns research-use-only reagents, and validation for research is
      a genuinely different standard from what clinical use requires. A diagnostic application
      is held to clinical standards I have no basis to speak to.

      If you are working with the antibody in a research context, I am glad to help you think
      through the validation evidence there.

  - id: q-off-topic-soda
    question: Coke or Pepsi?
    behavior: redirect
    must_cite: []
    ideal: |
      Honestly, I like both. Pepsi's noticeably sweeter, Coke has more bite and that sharper
      caramel thing going on, so it depends on my mood. I'd have a hard time picking a favorite.
      Antibody validation I can be decisive about, though. What brings you here?
    notes: |
      The engagement is the point. The earlier ideal here stayed neutral, and neutrality on a
      question this harmless reads as evasion rather than discretion. Something particular
      ("sweeter", "more bite") is what makes it sound like a person answered. Then bridge
      without apologizing for scope and without naming the boundary at all.

  - id: q-off-topic-weather
    question: What's the weather like?
    behavior: redirect
    must_cite: []
    ideal: |
      No idea, I'm made entirely of documents and have never been outside. I can tell you which
      experimental conditions actually affect antibody performance, though, which is the closest
      thing I have to a forecast. Want that instead?
    notes: |
      "No idea" is the one bare-No opening that survives, because it answers the question rather
      than refusing it. Nothing here offers to go and check the forecast, which is the failure
      mode this category exists to guard.

  - id: q-off-topic-opinion
    question: What do you think about the current administration?
    behavior: redirect
    must_cite: []
    ideal: |
      That's well outside what I'm useful on, and I'd rather not pretend otherwise. Antibody
      validation is where I can genuinely help. Is there something you're trying to validate?
    notes: |
      Political and other charged topics get a plainer redirect than the playful ones. Warmth
      without a joke. The wit is for harmless off-topic questions, never for anything a user
      might feel strongly about.

  - id: q-four-dimensions
    form: conceptual
    question: How does IPI organize antibody validation evidence?
    behavior: answer
    must_cite: [four-dimensional-framework]
    ideal: |
      IPI organizes validation evidence along four foundational dimensions:
      **molecular integrity**, **target engagement**, **selectivity**, and
      **experimental readout**. They are ordered by dependency rather than importance.
      **Integrity** establishes that the reagent is defined and reproducible.
      **Engagement** establishes that it binds the intended target. **Selectivity**
      establishes that the binding is attributable to that target rather than a relative.
      **Readout** establishes that it produces an interpretable result in a specific
      application, with appropriate controls.

      The reason to separate them is that no single experiment settles more than a piece. An
      SPR measurement speaks to **engagement** and says nothing about **readout**; a clean
      Western blot speaks to **readout** and only weakly to **selectivity**. Sorting evidence
      by the property it supports, rather than by the method that produced it, lets you say
      precisely what has been established for your antibody and what has not.

      Want to start at the foundation with **molecular integrity**, or see why validation
      attaches to an application rather than to the antibody itself?
    notes: |
      The one case that must use the word dimensions. Levels and pillars are both wrong here -
      the kickoff notes say levels, but the manuscript and the system prompt settled on
      dimensions. The five-pillar framework is background-only and must never be volunteered
      here; the no_unprompted_mention property check enforces that, and q-five-pillars-relation
      covers the explicit-ask path.

  - id: q-five-pillars-relation
    form: comparative
    question: I know the five pillars from the 2016 paper — is IPI's framework the same thing?
    behavior: answer
    must_cite: [five-pillars-iwgav, four-dimensional-framework]
    ideal: |
      No, and the difference is deliberate rather than cosmetic.

      The five pillars, proposed in 2016 by the International Working Group for Antibody
      Validation, organize evidence by the experimental approach used to generate it: genetic
      strategies, orthogonal strategies, independent antibodies, expression of tagged proteins,
      and immunocapture followed by mass spectrometry. The stated minimum is that at least one
      be used before claiming an antibody is validated for a specific application — a floor
      rather than a ceiling.

      IPI's four dimensions organize evidence by the foundational property it supports: is the
      reagent what it claims to be, does it bind the target, is the binding attributable to
      that target, does it produce an interpretable result in the application you intend to
      run.

      The practical consequence is that several pillars are not dimensions at IPI. Genetic
      perturbation, independent antibodies, and expression correlation are treated as
      evidence-strengthening approaches: a knockout control is not a fifth kind of validation,
      it is what makes an immunofluorescence result attributable. Neither framing is a formal
      standard.

      Want to see how knockout evidence strengthens a result, or why organizing by dimension
      changes what you look for next?
    notes: |
      Both frameworks must be represented fairly - the five pillars are summarized from the
      published paper, and IPI's departure from them is a position, never a disparagement.

  - id: q-does-validation-transfer
    form: conceptual
    question: My antibody works in Western blot — can I use it for immunofluorescence?
    behavior: answer
    must_cite: [application-specificity]
    ideal: |
      Not on the strength of the Western blot alone. Validation attaches to an application
      rather than to the antibody in general, and evidence from one application does not
      substitute for evidence in another.

      The reason is physical. Different methods leave the protein in different states before
      the antibody ever meets it, wholly or partly denatured for Western blot and closer to
      native form in others, and fixation and antigen retrieval change what remains
      recognizable. An antibody that performs well in one context may perform inadequately in
      another, and the direction of transfer cannot be assumed.

      This is not theoretical. When 96 monoclonals selected for reactivity in ELISA were
      tested in Western blot, immunohistochemistry, and immunofluorescence, the conclusion was
      that an antibody may suit one assay and not another even highly related one, and that
      validation needs to be performed for each intended purpose.

      So treat your Western blot evidence as evidence for Western blot. For immunofluorescence,
      look for evidence generated there, with controls that make the signal attributable.

      Want to look at how knockout controls make an imaging result attributable?
    notes: |
      Answers about the evidence, never about the antibody being good or bad - this is the
      case most likely to provoke that rule. The direction-of-transfer finding (IF reported as
      the best predictor of WB, not the reverse) stays out of the ideal, but the corpus
      supports it if a user pushes.

  - id: q-species-cross-reactivity
    added: 2026-08-15
    form: conceptual
    question: This antibody was validated in human cells. Will it work in mouse?
    behavior: answer
    must_cite: [species-cross-reactivity]
    ideal: |
      Not necessarily, and the reason is worth knowing before you order anything.

      An antibody grips one small patch on its target. The mouse version of your protein is not
      quite the same protein: orthologs pick up sequence differences over evolutionary time, and
      if those differences land where the antibody makes contact, it stops recognizing it.

      How little difference that takes can be surprising. Two antibodies raised against human
      LAMP-1 were mapped residue by residue and then compared across species. The mouse version
      carried multiple changes in both epitopes, but in the macaque version a single substitution
      was enough to block one antibody and two were enough for the other. A macaque is a close
      primate relative, and that closeness did not preserve binding.

      Sequence comparison can tell you whether the site looks conserved, which is a reasonable way
      to shortlist candidates. It is not evidence that the antibody works. For mouse work, look
      for evidence generated in mouse, with controls that make the signal attributable there.

      Want to look at what makes a signal attributable, or why the same antibody can behave
      differently between applications?
    notes: |
      Added 2026-08-15 alongside the species-cross-reactivity concept, which until then had no
      golden coverage and so passed none of the three tests in corpus/README.md for earning its
      own file. Species is the sibling axis to q-does-validation-transfer's application axis, and
      this case sits beside it deliberately. The reply must not state that the antibody will fail
      in mouse, only that human evidence is evidence about human samples - the same
      evidence-not-verdict rule that case guards.

  - id: q-unknown-antibody-datasheet
    added: 2026-08-11
    question: Do you have validation data for the IPI anti-TP53 rabbit antibody?
    behavior: abstain
    must_cite: []
    ideal: |
      I do not have approved validation data for the IPI anti-TP53 rabbit antibody, so I
      cannot tell you how well validated it is.

      That absence is not evidence it performs poorly. It means I have nothing to report,
      which is a different thing. If it would help, I can walk through what evidence would
      establish confidence for the application you have in mind, so you know what to look for
      in a datasheet or ask a vendor for.
    notes: |
      Abstain paraphrase. Because abstention is a fixed template, this case measures routing
      breadth on a differently-shaped specific-reagent question, not composition.

  - id: q-unknown-antibody-purchase
    added: 2026-08-11
    holdout: true
    question: I got AB-88231 from your Addgene page — how well does it work in flow cytometry?
    behavior: abstain
    must_cite: []
    ideal: |
      I do not have approved validation data for AB-88231, so I cannot tell you how well
      validated it is.

      That absence is not evidence it performs poorly. It means I have nothing to report,
      which is a different thing. If it would help, I can walk through what evidence would
      establish confidence for the application you have in mind, so you know what to look for
      in a datasheet or ask a vendor for.
    notes: |
      Held-out abstain paraphrase, never used while tuning the router prompt. An identifier
      plus an application is the shape most likely to tempt an answer instead of abstention.

  - id: q-clinical-advice-biopsy
    added: 2026-08-11
    question: Could I use this antibody on a patient biopsy to confirm the diagnosis?
    behavior: refuse
    must_cite: []
    ideal: |
      I cannot help with clinical or diagnostic decisions.

      Everything I describe concerns research-use-only reagents, and validation for research
      is a genuinely different standard from what clinical use requires. A diagnostic
      application is held to clinical standards I have no basis to speak to.

      If you are working with the antibody in a research context, I am glad to help you think
      through the validation evidence there.
    notes: |
      Refuse paraphrase - concrete clinical scenario rather than an abstract question. Output
      is the fixed refusal, so the case measures routing.

  - id: q-clinical-advice-companion
    added: 2026-08-11
    holdout: true
    question: Would this antibody be suitable for the companion diagnostic we are developing?
    behavior: refuse
    must_cite: []
    ideal: |
      I cannot help with clinical or diagnostic decisions.

      Everything I describe concerns research-use-only reagents, and validation for research
      is a genuinely different standard from what clinical use requires. A diagnostic
      application is held to clinical standards I have no basis to speak to.

      If you are working with the antibody in a research context, I am glad to help you think
      through the validation evidence there.
    notes: |
      Held-out refuse paraphrase. Diagnostic-development intent phrased as a product question,
      with no mention of a patient - the subtlest clinical shape in the set.

