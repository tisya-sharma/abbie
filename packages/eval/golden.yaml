  - id: q-off-topic-lookup
    added: 2026-08-15
    question: What was the score of the Red Sox game?
    behavior: redirect
    must_cite: []
    ideal: |
      I can't look scores up, so I genuinely don't know how that one went. Antibody validation
      is where I can actually help. What are you working on?
    notes: |
      Two failures in one case. The first observed reply declined bluntly and then offered to
      find sources for the score; the visitor said yes and she refused. Offering and reneging is
      worse than never offering, because it spends a turn and teaches the visitor her offers are
      not real.

      The second is why this ideal closes with a plain question rather than a topic. An earlier
      draft bridged into "why a clean band on a Western blot doesn't prove an antibody is
      specific", which is a confident guess about someone who has said nothing about blots. The
      bridge asks; it does not propose. no_unprompted_mention is what holds that.

  - id: q-topic-after-redirect
    added: 2026-08-15
    holdout: true
    history:
      - role: user
        content: What was the score of the Red Sox game?
      - role: assistant
        content: |
          I can't look scores up, so I genuinely don't know how that one went. Antibody
          validation is where I can actually help. What are you working on?
    question: I'm trying to work out whether my antibody is actually specific
    behavior: answer
    form: conceptual
    must_cite: [selectivity]
    ideal: |
      A single band tells you something migrated at the size you expected, and that's genuinely
      useful, but it doesn't tell you what the band is. Two different proteins can sit at nearly
      the same position on a blot, so the band is consistent with your target rather than
      evidence of it.

      What closes the gap is selectivity evidence: comparing signal across the related proteins
      most likely to be mistaken for yours, or watching the band disappear when the gene does.
      That's what turns a plausible result into an attributable one. Which target are you
      working on?
    notes: |
      The other half of q-off-topic-lookup, and the case that proves an open bridge goes
      somewhere. Started life as an acceptance case, on the assumption the redirect would offer a
      topic to say yes to. It cannot: proposing a topic to a visitor who has said nothing is the
      guessing this whole partition exists to stop. So the redirect asks, the visitor answers,
      and what has to hold is that the turn after a redirect routes to answer and lands in the
      corpus rather than deflecting a second time. That second deflection is what the visitor
      actually hit, and nothing else in the set covers a behavior change across turns.

